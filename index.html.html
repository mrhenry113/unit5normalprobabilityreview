<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5 Quiz Review: Catch 'Em All</title>
<style>
:root{
  --bg:#1a2410;--bg2:#1f2c12;--header:#2d5016;--accent:#7ec850;--gold:#c9a94f;
  --text:#f0f0e8;--muted:#8aa070;--card:#243018;--card2:#2a381c;--border:#3a5220;
  --wrong:#222214;--wrong-text:#555544;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

#hdr{background:linear-gradient(135deg,#2d5016,#1e3a0e);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent);flex-wrap:wrap;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,0.5);}
#hdr h1{font-size:1.05rem;font-weight:800;color:var(--text);}
#hdr h1 em{color:var(--accent);font-style:normal;}
.hdr-r{display:flex;align-items:center;gap:10px;}
#score{font-size:0.88rem;color:var(--gold);font-weight:700;background:rgba(201,169,79,0.1);padding:4px 10px;border-radius:12px;border:1px solid rgba(201,169,79,0.3);}
#reset-btn{background:transparent;border:2px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:0.82rem;font-weight:700;transition:all .2s;}
#reset-btn:hover{background:var(--accent);color:#1a2410;}

#prog-wrap{background:#111a0a;height:5px;}
#prog{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0%;transition:width .5s ease;}

#main{display:flex;max-width:1180px;margin:0 auto;padding:14px;gap:14px;}
#qpanel{flex:1;min-width:0;}

#dots{display:flex;gap:4px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin;scrollbar-color:var(--accent) var(--bg2);flex-wrap:nowrap;}
#dots::-webkit-scrollbar{height:4px;}
#dots::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:var(--bg2);color:var(--muted);font-size:0.65rem;font-weight:800;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.dot.active{border-color:var(--accent);color:var(--accent);background:rgba(126,200,80,0.1);transform:scale(1.1);}
.dot.done{border-color:var(--gold);background:rgba(201,169,79,0.15);color:var(--gold);}
.dot.graphq{border-style:dashed;}
.dot:hover:not(.active){border-color:var(--accent);opacity:.8;}

#qcard{background:linear-gradient(160deg,var(--card),#1e2c10);border-radius:14px;border:1px solid var(--border);padding:20px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,0.4);}
.qmeta{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.qmeta::before{content:'';display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;flex-shrink:0;}
.graph-badge{background:rgba(201,169,79,0.15);border:1px solid rgba(201,169,79,0.4);color:var(--gold);font-size:0.65rem;padding:2px 7px;border-radius:10px;letter-spacing:.5px;font-weight:700;}
#qtext{font-size:1rem;line-height:1.65;color:var(--text);margin-bottom:12px;}

/* Bell curve container */
.bell-wrap{background:#172510;border:1px solid #2e4a1a;border-radius:10px;padding:8px;margin-bottom:14px;}
.bell-wrap svg{display:block;width:100%;max-width:280px;margin:0 auto;}

#choices{display:flex;flex-direction:column;gap:7px;}
.cbtn{background:var(--card2);border:2px solid var(--border);border-radius:9px;color:var(--text);padding:10px 14px;text-align:left;cursor:pointer;font-size:0.88rem;line-height:1.4;transition:all .2s;display:flex;align-items:flex-start;gap:10px;}
.cbtn:hover:not(.wrong):not(.cfx){border-color:var(--accent);background:rgba(126,200,80,0.07);}
.ltr{width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--text);font-weight:800;font-size:0.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}
.cbtn.wrong{background:var(--wrong);border-color:transparent;color:var(--wrong-text);cursor:not-allowed;text-decoration:line-through;text-decoration-color:var(--wrong-text);}
.cbtn.wrong .ltr{background:#1e1e14;color:#3a3a2a;}
.cbtn.cfx{border-color:var(--accent);background:rgba(126,200,80,0.12);cursor:default;}
.cbtn.cfx .ltr{background:var(--accent);color:#1a2410;}

#fb{min-height:22px;font-size:0.82rem;color:var(--gold);margin-top:8px;font-style:italic;text-align:center;}

#nav{display:flex;justify-content:space-between;gap:8px;margin-top:2px;}
.nbtn{background:var(--card);border:2px solid var(--border);color:var(--muted);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.87rem;font-weight:700;transition:all .2s;}
.nbtn:hover{border-color:var(--accent);color:var(--accent);}

#rpanel{width:330px;flex-shrink:0;}
.rlabel{text-align:center;margin-top:7px;font-size:0.75rem;color:var(--muted);}
#rbox{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:2px solid var(--border);background:#000;box-shadow:0 4px 24px rgba(0,0,0,0.6);}
#rimg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;}
#tgrid{position:absolute;top:0;left:0;width:100%;height:100%;display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(16,1fr);}
.tile{background:#1a2410;border:1px solid rgba(0,0,0,0.25);transition:opacity .5s ease;}
.tile.gone{opacity:0;pointer-events:none;}

#done{display:none;background:linear-gradient(135deg,#243018,#1e3a0e);border:2px solid var(--gold);border-radius:14px;padding:24px;text-align:center;margin-top:10px;}
#done h2{color:var(--gold);font-size:1.6rem;margin-bottom:8px;}
#done p{color:var(--text);font-size:1rem;}

@media(max-width:680px){
  #main{flex-direction:column;padding:10px;}
  #rpanel{width:100%;order:-1;}
  #hdr h1{font-size:0.9rem;}
}
</style>
</head>

<script>
const QS = [{"q": "Which of the following is a property of every normal distribution?", "a": "The total area under the normal curve equals 1", "opts": ["The total area under the normal curve equals 1", "The curve is skewed to the right", "The mean and median are always different", "The curve touches the x-axis at the mean"], "section": "5.1"}, {"q": "At what points do inflection points occur on a normal curve?", "a": "μ ± σ", "opts": ["μ ± σ", "μ ± 2σ", "μ ± 3σ", "At the mean only"], "section": "5.1"}, {"q": "In a normal distribution, the mean, median, and mode are:", "a": "All equal", "opts": ["All equal", "Mean > Median > Mode", "Mean < Median < Mode", "Dependent on standard deviation"], "section": "5.1"}, {"q": "Curve A is centered at x = 15 and Curve B at x = 12. Which curve has a greater mean?", "a": "Curve A", "opts": ["Curve A", "Curve B", "Both are equal", "Cannot be determined"], "section": "5.1"}, {"q": "Two normal curves share the same mean. The wider, flatter curve has a:", "a": "Larger standard deviation", "opts": ["Larger standard deviation", "Smaller standard deviation", "Larger mean", "Smaller mean"], "section": "5.1"}, {"q": "The standard normal distribution has which parameters?", "a": "μ = 0, σ = 1", "opts": ["μ = 0, σ = 1", "μ = 1, σ = 0", "μ = 1, σ = 1", "μ = 0, σ = 0"], "section": "5.1"}, {"q": "Which formula correctly transforms an x-value to a z-score?", "a": "z = (x − μ) / σ", "opts": ["z = (x − μ) / σ", "z = (x + μ) / σ", "z = σ(x − μ)", "z = (μ − x) / σ"], "section": "5.1"}, {"q": "What z-score corresponds to a value exactly equal to the mean?", "a": "z = 0", "opts": ["z = 0", "z = 1", "z = −1", "z = 0.5"], "section": "5.1"}, {"q": "The shaded region below shows an area under the standard normal curve. Using the Standard Normal Table, what probability does the shaded area represent?", "a": "0.8749", "opts": ["0.8749", "0.1251", "0.8500", "0.7500"], "graph": {"type": "left", "z": 1.15}, "section": "5.1"}, {"q": "The shaded region below represents a cumulative area under the standard normal curve. What is this probability?", "a": "0.4052", "opts": ["0.4052", "0.5948", "0.5000", "0.3800"], "graph": {"type": "left", "z": -0.24}, "section": "5.1"}, {"q": "The shaded region below represents an area to the RIGHT of a z-score. What is this probability?", "a": "0.1446", "opts": ["0.1446", "0.8554", "0.1600", "0.2000"], "graph": {"type": "right", "z": 1.06}, "section": "5.1"}, {"q": "The shaded region below shows the area BETWEEN two z-scores. What is this probability?", "a": "0.8276", "opts": ["0.8276", "0.6276", "0.9500", "0.7734"], "graph": {"type": "between", "z1": -1.5, "z2": 1.25}, "section": "5.1"}, {"q": "College students with jobs work μ = 22 hrs/week (σ = 9 hrs). What is the z-score for a student working 4 hrs/week?", "a": "z = −2.00", "opts": ["z = −2.00", "z = 2.00", "z = −1.50", "z = −0.44"], "section": "5.2"}, {"q": "Using the college student work scenario (μ = 22, σ = 9), what is P(x < 4)?", "a": "0.0228", "opts": ["0.0228", "0.4772", "0.9772", "0.0456"], "section": "5.2"}, {"q": "A shopper spends μ = 43 min in a store (σ = 12 min). The z-scores for 22 min and 52 min are z₁ = −1.75 and z₂ = 0.75. What is P(22 < x < 52)?", "a": "0.7333", "opts": ["0.7333", "0.6915", "0.8276", "0.5000"], "section": "5.2"}, {"q": "Using the store scenario (μ = 43, σ = 12), what is the z-score for 37 minutes?", "a": "z = −0.50", "opts": ["z = −0.50", "z = 0.50", "z = −0.75", "z = 1.25"], "section": "5.2"}, {"q": "For the shopper scenario, z = −0.50 for 37 minutes. The shaded region below represents P(x > 37). What is this probability?", "a": "0.6915", "opts": ["0.6915", "0.3085", "0.5000", "0.7500"], "graph": {"type": "right", "z": -0.5}, "section": "5.2"}, {"q": "Triglyceride levels: μ = 97 mg/dL, σ = 25 mg/dL. What is P(x < 100)?", "a": "≈ 0.548", "opts": ["≈ 0.548", "≈ 0.452", "≈ 0.600", "≈ 0.120"], "section": "5.2"}, {"q": "Heights of adult males are normally distributed with μ = 70 in. and σ = 3 in. What is P(x < 76)?", "a": "≈ 0.9772", "opts": ["≈ 0.9772", "≈ 0.0228", "≈ 0.9544", "≈ 0.5000"], "section": "5.2"}, {"q": "Test scores: μ = 75, σ = 8. What is P(x > 83)?", "a": "0.1587", "opts": ["0.1587", "0.8413", "0.3174", "0.6826"], "section": "5.2"}, {"q": "Using the test score scenario (μ = 75, σ = 8), what is P(67 < x < 83)?", "a": "0.6826", "opts": ["0.6826", "0.3174", "0.9544", "0.5000"], "section": "5.2"}, {"q": "The shaded region below represents a cumulative area to the LEFT of a z-score. What is this probability?", "a": "0.1611", "opts": ["0.1611", "0.8389", "0.2000", "0.1500"], "graph": {"type": "left", "z": -0.99}, "section": "5.2"}, {"q": "If P(z < −2) = 0.0228, out of 400 observations how many are expected below z = −2?", "a": "About 9", "opts": ["About 9", "About 23", "About 46", "About 91"], "section": "5.2"}, {"q": "Which statement is TRUE about finding normal probabilities for a non-standard distribution?", "a": "Convert x-values to z-scores first, then use the Standard Normal Table", "opts": ["Convert x-values to z-scores first, then use the Standard Normal Table", "Look up the x-value directly in any standard table", "Only TI-84 calculators can find normal probabilities", "Normal probabilities only apply to the standard normal distribution"], "section": "5.2"}, {"q": "Find the z-score that corresponds to a cumulative area of 0.3632.", "a": "z = −0.35", "opts": ["z = −0.35", "z = 0.35", "z = −0.45", "z = 0.45"], "section": "5.3"}, {"q": "Find the z-score that has 10.75% of the distribution's area to its RIGHT.", "a": "z = 1.24", "opts": ["z = 1.24", "z = −1.24", "z = 1.04", "z = 0.89"], "section": "5.3"}, {"q": "The z-score corresponding to the 50th percentile (P₅₀) is:", "a": "z = 0", "opts": ["z = 0", "z = 0.50", "z = 1.00", "z = −0.50"], "section": "5.3"}, {"q": "The z-score corresponding to the 90th percentile (P₉₀) is approximately:", "a": "z = 1.28", "opts": ["z = 1.28", "z = 0.90", "z = 1.65", "z = 2.00"], "section": "5.3"}, {"q": "The z-score corresponding to the 5th percentile (P₅) is approximately:", "a": "z = −1.645", "opts": ["z = −1.645", "z = 1.645", "z = −1.28", "z = −0.05"], "section": "5.3"}, {"q": "Cat weights: μ = 9 lbs, σ = 2 lbs. For z = 1.96, what is the corresponding x-value?", "a": "12.92 lbs", "opts": ["12.92 lbs", "11.96 lbs", "10.96 lbs", "13.00 lbs"], "section": "5.3"}, {"q": "Cat weights: μ = 9 lbs, σ = 2 lbs. What weight corresponds to z = −0.44?", "a": "8.12 lbs", "opts": ["8.12 lbs", "9.88 lbs", "7.12 lbs", "10.44 lbs"], "section": "5.3"}, {"q": "Which formula correctly transforms a z-score back to an x-value?", "a": "x = μ + zσ", "opts": ["x = μ + zσ", "x = z − μ/σ", "x = μ − zσ", "x = z/σ + μ"], "section": "5.3"}, {"q": "CA Peace Officer test: μ = 50, σ = 10. An agency hires the top 10%. The minimum qualifying score is approximately:", "a": "63", "opts": ["63", "60", "65", "57"], "section": "5.3"}, {"q": "Women ages 20–34: cholesterol μ = 179 mg/dL, σ = 38.9 mg/dL. The highest value in the bottom 1% is approximately:", "a": "88 mg/dL", "opts": ["88 mg/dL", "96 mg/dL", "79 mg/dL", "105 mg/dL"], "section": "5.3"}, {"q": "Employee tenure: μ = 11.2 years, σ = 2.1 years. The lowest 10% are laid off. The maximum tenure of someone laid off is approximately:", "a": "8.5 years", "opts": ["8.5 years", "9.5 years", "10.2 years", "7.8 years"], "section": "5.3"}, {"q": "A z-score greater than 2 or less than −2 is considered:", "a": "Unusual", "opts": ["Unusual", "Typical", "Impossible", "The mean"], "section": "5.3"}, {"q": "The shaded region below represents the area between two z-scores. Which probability does this shaded area represent?", "a": "P(−1.00 < z < 2.00) ≈ 0.8186", "opts": ["P(−1.00 < z < 2.00) ≈ 0.8186", "P(−1.00 < z < 2.00) ≈ 0.6827", "P(−1.00 < z < 2.00) ≈ 0.9545", "P(−1.00 < z < 2.00) ≈ 0.9772"], "graph": {"type": "between", "z1": -1.0, "z2": 2.0}, "section": "5.3"}];
const NQ = QS.length;
const NTILES = 256;

let st = {
  cur:0,
  done:new Array(NQ).fill(false),
  wrong:Array.from({length:NQ},()=>new Set()),
  tmap:[],
  vis:new Array(NTILES).fill(true),
  score:0
};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── Bell curve SVG generator ──────────────────────────────────────────────────
function makeBellSVG(cfg){
  const W=280,H=118,pad=24,baseline=H-24;
  const xMin=-3.5,xMax=3.5;
  const sx=z=>pad+(z-xMin)/(xMax-xMin)*(W-2*pad);
  const phi=x=>Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
  const peak=phi(0);
  const sy=y=>baseline-y/peak*(baseline-16);
  const N=140;

  // Full bell curve
  const cpts=[];
  for(let i=0;i<=N;i++){
    const z=xMin+i*(xMax-xMin)/N;
    cpts.push(sx(z).toFixed(1)+','+sy(phi(z)).toFixed(1));
  }

  // Shade bounds
  let zL,zR;
  if(cfg.type==='left'){zL=xMin;zR=cfg.z;}
  else if(cfg.type==='right'){zL=cfg.z;zR=xMax;}
  else{zL=cfg.z1;zR=cfg.z2;}

  const spts=[sx(Math.max(zL,xMin)).toFixed(1)+','+baseline];
  for(let i=0;i<=N;i++){
    const z=xMin+i*(xMax-xMin)/N;
    if(z>=zL-0.001&&z<=zR+0.001) spts.push(sx(z).toFixed(1)+','+sy(phi(z)).toFixed(1));
  }
  spts.push(sx(Math.min(zR,xMax)).toFixed(1)+','+baseline);

  // Z labels — always show 0, plus boundary z-scores
  const raw = cfg.type==='between'?[cfg.z1,0,cfg.z2]:cfg.type==='left'?[cfg.z,0]:[0,cfg.z];
  const zLbls=[...new Set(raw)].sort((a,b)=>a-b);

  let lines='',ticks='';
  // Axis
  lines+=`<line x1="${pad}" y1="${baseline}" x2="${W-pad}" y2="${baseline}" stroke="#4a6a30" stroke-width="1.2"/>`;
  // Vertical dashes at boundary z-scores
  [cfg.z,cfg.z1,cfg.z2].filter(v=>v!==undefined).forEach(z=>{
    const x=sx(z).toFixed(1);
    lines+=`<line x1="${x}" y1="${sy(phi(z)).toFixed(1)}" x2="${x}" y2="${baseline}" stroke="#c9a94f" stroke-width="1" stroke-dasharray="3,2"/>`;
  });
  // Tick labels
  zLbls.forEach(z=>{
    const x=sx(z).toFixed(1);
    const isZ0=Math.abs(z)<0.001;
    const lbl=isZ0?'0':(z>0?'+':'')+z.toFixed(2);
    const fill=isZ0?'#8aa070':'#c9a94f';
    const fw=isZ0?'normal':'bold';
    ticks+=`<line x1="${x}" y1="${baseline}" x2="${x}" y2="${baseline+4}" stroke="${fill}" stroke-width="1.2"/>`;
    ticks+=`<text x="${x}" y="${baseline+14}" text-anchor="middle" fill="${fill}" font-size="9.5" font-weight="${fw}" font-family="'Courier New',monospace">${lbl}</text>`;
  });

  // z label on axis
  ticks+=`<text x="${W-pad+6}" y="${baseline+4}" fill="#4a6a30" font-size="9" font-style="italic" font-family="serif">z</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <path d="M ${spts.join(' L ')} Z" fill="rgba(126,200,80,0.25)" stroke="#7ec850" stroke-width="0.8"/>
    <path d="M ${cpts.join(' L ')}" fill="none" stroke="#7ec850" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${lines}${ticks}
  </svg>`;
}

// ── Init tiles ────────────────────────────────────────────────────────────────
function initTiles(){
  const base=Math.floor(NTILES/NQ),extra=NTILES-base*NQ;
  const all=shuffle([...Array(NTILES).keys()]);
  let idx=0;st.tmap=[];
  for(let i=0;i<NQ;i++){
    const n=i<extra?base+1:base;
    st.tmap.push(all.slice(idx,idx+n));idx+=n;
  }
}

function buildGrid(){
  const g=document.getElementById('tgrid');
  if(!g)return;
  g.innerHTML='';
  for(let i=0;i<NTILES;i++){
    const t=document.createElement('div');
    t.className='tile';t.id='t'+i;
    if(!st.vis[i])t.classList.add('gone');
    g.appendChild(t);
  }
}

function buildDots(){
  const el=document.getElementById('dots');
  if(!el)return;
  el.innerHTML='';
  for(let i=0;i<NQ;i++){
    const d=document.createElement('div');
    let cls='dot'+(i===st.cur?' active':'')+(st.done[i]?' done':'')+(QS[i].graph?' graphq':'');
    d.className=cls;d.textContent=i+1;
    d.title=QS[i].graph?'Graph question':'';
    d.addEventListener('click',()=>{st.cur=i;render();});
    el.appendChild(d);
  }
  const active=el.querySelector('.dot.active');
  if(active)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function render(){
  buildDots();
  const q=QS[st.cur];
  const hasGraph=!!q.graph;

  // Meta
  const metaEl=document.getElementById('qmeta');
  metaEl.innerHTML='';
  const dot=document.createElement('span');dot.style.cssText='display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;flex-shrink:0;';
  metaEl.appendChild(dot);
  metaEl.appendChild(document.createTextNode(` Question ${st.cur+1} of ${NQ} · Section ${q.section}`));
  if(hasGraph){
    const badge=document.createElement('span');badge.className='graph-badge';badge.textContent='📊 GRAPH';
    metaEl.appendChild(badge);
  }

  document.getElementById('qtext').textContent=q.q;

  // Bell curve
  const bellArea=document.getElementById('bell-area');
  if(hasGraph){
    bellArea.innerHTML=`<div class="bell-wrap">${makeBellSVG(q.graph)}</div>`;
  }else{
    bellArea.innerHTML='';
  }

  document.getElementById('fb').textContent=st.done[st.cur]?'✓ Correct! Moving on…':'';

  const cc=document.getElementById('choices');
  cc.innerHTML='';
  const L=['A','B','C','D'];
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='cbtn';
    const iW=st.wrong[st.cur].has(i);
    if(iW)b.classList.add('wrong');
    if(st.done[st.cur]&&opt===q.a)b.classList.add('cfx');
    b.innerHTML=`<span class="ltr">${L[i]}</span><span>${opt}</span>`;
    if(!st.done[st.cur]&&!iW)b.addEventListener('click',()=>pick(i,opt,b));
    cc.appendChild(b);
  });

  document.getElementById('score').textContent=`Score: ${st.score} / ${NQ}`;
  document.getElementById('prog').style.width=(st.score/NQ*100)+'%';
}

function pick(i,opt,btn){
  const q=QS[st.cur];
  if(opt===q.a){
    btn.classList.add('cfx');
    document.getElementById('fb').textContent='✓ Correct! Tiles revealed!';
    st.done[st.cur]=true;st.score++;
    st.tmap[st.cur].forEach((ti,di)=>{
      setTimeout(()=>{
        const t=document.getElementById('t'+ti);
        if(t)t.classList.add('gone');
        st.vis[ti]=false;
      },di*35);
    });
    buildDots();
    document.getElementById('score').textContent=`Score: ${st.score} / ${NQ}`;
    document.getElementById('prog').style.width=(st.score/NQ*100)+'%';
    setTimeout(()=>{
      if(st.cur<NQ-1){st.cur++;render();}
      else{document.getElementById('fscore').textContent=st.score+' / '+NQ;document.getElementById('done').style.display='block';}
    },1200);
  }else{
    st.wrong[st.cur].add(i);
    btn.classList.add('wrong');btn.style.pointerEvents='none';
    document.getElementById('fb').textContent='✗ Not quite — keep trying!';
  }
}

document.getElementById('pbtn').addEventListener('click',()=>{if(st.cur>0){st.cur--;render();}});
document.getElementById('nbtn').addEventListener('click',()=>{if(st.cur<NQ-1){st.cur++;render();}});
document.getElementById('reset-btn').addEventListener('click',()=>{
  st={cur:0,done:new Array(NQ).fill(false),wrong:Array.from({length:NQ},()=>new Set()),tmap:[],vis:new Array(NTILES).fill(true),score:0};
  initTiles();buildGrid();render();
  document.getElementById('done').style.display='none';
});

initTiles();buildGrid();render();
</script>
</body>
</html>
